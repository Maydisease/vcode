<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<style>
      * {
          margin: 0;
          padding: 0;
          font-size: 0;
      }

      html, body {
          width: 100%;
          height: 100%;
      }

      body {
          display: flex;
          flex-direction: column;
      }

      body > .toolbar {
          height: 80px;
          min-height: 80px;
          background: #eee;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 0 12px;
          font-size: 12px;
      }

      .toolbar button {
          font-size: 14px;
          padding: 6px 12px;
          cursor: pointer;
      }

      .toolbar .status {
          font-size: 12px;
          color: #333;
      }

      body > iframe {
          width: 100%;
		      flex: 1;
          height: 0;
          margin: 0;
          padding: 0;
          font-size: 0;
          border: none;
      }
	</style>
</head>
<body>

<div class="toolbar">
	<button data-sample="form">示例：EasyForm</button>
	<button data-sample="table">示例：EasyTable + EasySearch</button>
	<button data-sample="dialog">示例：EasyDialog</button>
	<div class="status" id="status">等待发送</div>
</div>
<iframe id="previewFrame" src="/playground.html"></iframe>

<script>
  const frame = document.getElementById('previewFrame');
  const statusEl = document.getElementById('status');

  let requestId = 0;

  const samples = {
    form: `import { useMemo, useState } from "react";
import { Button, Space } from "antd";
import { EasyFormService } from "easy-form";

export default function App() {
  const formInst = useMemo(() => new EasyFormService(), []);
  const [result, setResult] = useState(null);

  const config = useMemo(() =>
    formInst.defineConfig([
      { type: "text", name: "title", label: "标题", required: true },
      {
        type: "select",
        name: "level",
        label: "级别",
        required: true,
        data: [
          { label: "S", value: "s" },
          { label: "A", value: "a" },
          { label: "B", value: "b" }
        ]
      },
      {
        type: "dateRange",
        name: "window",
        label: "时间窗",
        transformResult: ["startTime", "endTime"]
      }
    ]),
    [formInst]
  );

  const layout = useMemo(() =>
    formInst.defineLayoutConfig({
      labelVertical: true,
      matrix: [["title:12", "level:12"], ["window:24"]]
    }),
    [formInst]
  );

  return (
    <div style={{ padding: 12 }}>
      <formInst.Form config={config} layout={layout} />
      <Space style={{ marginTop: 12 }}>
        <Button
          type="primary"
          onClick={async () => {
            const values = await formInst.$submit({ returnRaw: false });
            setResult(values);
          }}
        >
          提交
        </Button>
        <Button onClick={() => formInst.$reset(true)}>清空</Button>
      </Space>
      <pre style={{ marginTop: 12, fontSize: 12 }}>
        {JSON.stringify(result, null, 2)}
      </pre>
    </div>
  );
}
`,
    table: `import React, { useMemo, useRef, useState } from "react";
import { Button, Space, message } from "antd";
import { EasySearch, EasyTable } from "easy-form";

const rawData = [
  { id: 1, name: "Alice", role: "管理员", status: "active", createdAt: "2024-01-02" },
  { id: 2, name: "Bob", role: "运营", status: "active", createdAt: "2024-01-08" },
  { id: 3, name: "Cora", role: "客服", status: "disabled", createdAt: "2024-01-16" },
  { id: 4, name: "Dylan", role: "产品", status: "active", createdAt: "2024-01-18" },
  { id: 5, name: "Evan", role: "技术", status: "pending", createdAt: "2024-01-21" },
  { id: 6, name: "Faye", role: "运营", status: "active", createdAt: "2024-02-01" },
  { id: 7, name: "Glen", role: "销售", status: "disabled", createdAt: "2024-02-06" },
  { id: 8, name: "Hana", role: "技术", status: "active", createdAt: "2024-02-10" },
  { id: 9, name: "Iris", role: "产品", status: "pending", createdAt: "2024-02-14" },
  { id: 10, name: "Jude", role: "客服", status: "active", createdAt: "2024-02-20" }
];

export default function App() {
  const searchRef = useRef(null);
  const tableRef = useRef(null);
  const [data, setData] = useState(rawData);

  const columns = useMemo(
    () => [
      { title: "ID", dataIndex: "id", width: 80 },
      { title: "姓名", dataIndex: "name" },
      { title: "角色", dataIndex: "role" },
      {
        title: "状态",
        dataIndex: "status",
        "mapping.tag": [
          ["active", "green", "启用"],
          ["pending", "orange", "待处理"],
          ["disabled", "red", "停用"]
        ]
      },
      { title: "创建时间", dataIndex: "createdAt" }
    ],
    []
  );

  const searchConfig = useMemo(
    () => [
      { type: "text", name: "keyword", label: "关键字" },
      {
        type: "select",
        name: "status",
        label: "状态",
        data: [
          { label: "全部", value: "" },
          { label: "启用", value: "active" },
          { label: "待处理", value: "pending" },
          { label: "停用", value: "disabled" }
        ]
      }
    ],
    []
  );

  const handleSearch = (values) => {
    const keyword = values.keyword ? String(values.keyword).toLowerCase() : "";
    const status = values.status || "";
    const next = rawData.filter((item) => {
      const hitKeyword =
        !keyword ||
        item.name.toLowerCase().includes(keyword) ||
        item.role.toLowerCase().includes(keyword);
      const hitStatus = !status || item.status === status;
      return hitKeyword && hitStatus;
    });
    setData(next);
  };

  const handleReset = () => {
    setData(rawData);
  };

  return (
    <div style={{ padding: 16 }}>
      <EasySearch
        ref={searchRef}
        config={searchConfig}
        tableRef={tableRef}
        searchHandle={handleSearch}
        resetHandle={handleReset}
      />
      <div style={{ margin: "12px 0" }}>
        <Space>
          <Button
            type="primary"
            onClick={() => message.info("这里可以放顶部按钮")}
          >
            操作示例
          </Button>
          <Button onClick={() => setData(rawData)}>重置数据</Button>
        </Space>
      </div>
      <EasyTable
        ref={tableRef}
        rowKey="id"
        dataSource={data}
        columns={columns}
        rowSelection="checkbox"
        quickSearchColumns={["name:keyword"]}
        actionBarMenus={[
          { label: "新增", onHandle: () => message.success("新增") },
          { label: "导出", onHandle: () => message.success("导出") }
        ]}
        rowActionMenus={(id, record) => [
          {
            label: "查看",
            onHandle: () => message.info(\`查看：\${record.name}\`)
          },
          {
            label: "删除",
            isDanger: true,
            secTip: "确认删除这条数据？",
            onHandle: () => message.error(\`已删除：\${record.name}\`)
          }
        ]}
      />
    </div>
  );
}
`,
    dialog: `import React, { useMemo } from "react";
import { Button, Space } from "antd";
import { EasyDialog } from "easy-form";

const DialogContent = React.forwardRef((props, ref) => {
  React.useImperativeHandle(ref, () => ({
    onConfirm: async () => "ok",
    onCancel: async () => "cancel"
  }));

  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontWeight: 700, marginBottom: 8 }}>自定义内容区</div>
      <div style={{ color: "#666" }}>
        这里可以放 EasyForm 或任何 React 组件。
      </div>
    </div>
  );
});

export default function App() {
  const dialog = useMemo(() => new EasyDialog(), []);

  return (
    <div style={{ padding: 20 }}>
      <Space wrap>
        <Button
          type="primary"
          onClick={() =>
            dialog.modal("编辑信息", {
              component: DialogContent,
              width: 520
            })
          }
        >
          打开 Modal
        </Button>
        <Button
          onClick={() =>
            dialog.drawer("侧边抽屉", {
              component: DialogContent,
              width: 520
            })
          }
        >
          打开 Drawer
        </Button>
        <Button
          onClick={() =>
            dialog.message("success", "操作成功", "数据已保存")
          }
        >
          Message
        </Button>
        <Button
          danger
          onClick={() =>
            dialog.confirm("删除确认", "确定要删除这条记录吗？")
          }
        >
          Confirm
        </Button>
      </Space>
    </div>
  );
}
`
  };

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function sendCode(code) {
    if (!frame.contentWindow) {
      setStatus('iframe 未就绪');
      return;
    }
    requestId += 1;
    frame.contentWindow.postMessage({
      code,
      requestId: String(requestId)
    }, '*');
    setStatus('已发送，等待渲染结果…');
  }

  document.querySelectorAll('[data-sample]').forEach((button) => {
    button.addEventListener('click', () => {
      const key = button.getAttribute('data-sample');
      const code = samples[key];
      if (!code) {
        setStatus('示例不存在');
        return;
      }
      sendCode(code);
    });
  });

  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.type === 'easyform:render:ok') {
      setStatus(`渲染成功 (compile ${data.metrics.compileMs.toFixed(1)}ms / import ${data.metrics.importMs.toFixed(1)}ms / render ${data.metrics.renderMs.toFixed(1)}ms)`);
      return;
    }
    if (data.type === 'easyform:render:error') {
      setStatus(`渲染失败: ${data.error?.message || '未知错误'}`);
    }
  });
</script>

</body>
</html>
